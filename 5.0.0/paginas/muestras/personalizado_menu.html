            width: 45px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .menu_flotante .item {
            display: flex;
            justify-content: start;
            align-items: center;
            padding: 5px 4px;
        }

        .menu_flotante .item i{
            margin-right: 20px;
            margin-left: 20px;
            font-size: 22px;
            color: rgb(70, 70, 70);
        }

        .menu_flotante .item a{
            text-decoration: none;
            font-size: 18px;
            color: rgb(70, 70, 70);
        }


        .menu_flotante .item:hover > a{
            color: rgb(153, 153, 153);
        }

        .menu_flotante .item:hover > i{
            color: rgb(153, 153, 153);
        }


        </style>
