<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Biblioteca CSS y JS para la rápida creación del frontend de sitios y aplicaciones web.">
    <link rel="canonical" href="https://bodystyle.webcindario.com">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="./css/bodystyle.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet"
        href="https://rawcdn.githack.com/FedeManzano/bodystyle-icons/refs/heads/master/iconos/bs-iconos.min.css">

    <title>Bodystyle</title>
</head>

<body>

    <!-- Nav con un ID #nav para envolverlo y manejarlo -->
    <!--
        Notese, que el nav tiene el data-target que apunta a 
        #bs-nav-sidebar que es el ID del sidebar 
    -->
    <!--
        El ID del sidebar los pueden elegir ustedes pero tiene 
        que coincidir con lo cargado en el data-target 
    -->
    <nav id="nav" class="bs-nav bs-nav-fixed gradiente-linear-carbon" data-target="#bs-nav-sidebar">
        <div class="bs-nav-lg align-left-list">
            <!-- 
                Botón de menú que funciona como disparador 
                de la aparición del sidebar 
            -->
            <a class="btn-menu ocultar-solo-grandes"></a>

            <a class="logo-container">
                <img id="logo" src="./images/logo_bodystyle.svg" 
                class="disparador" data-info="" alt="Foto de perfil">
            </a>
            <!--Lista de opciones del nan principal -->
            <div class="ocultar-desde-medianos">
                <ul>
                    <li><a href="pages/get_started.html" class="com-trigger" data-info="Inicio de la Documentación.">Docs</a></li>
                    <li><a target="_blank" href="https://github.com/FedeManzano/bodystyle"
                        class="com-trigger" data-info="Repositorio Oficial de <span class='f-w-7'>Bodystyle</span>">Repositorio</a></li>
                </ul>
            </div>
            <div class="right-content">
                <a><i id="descarga" class="bs-download fz-33 c-white disparador" data-info="" data-pos="right" data-evt="click"></i></a>
                <a target="_blank" href="https://github.com/FedeManzano/bodystyle"><i class="bs-github-2 ml-2 fz-33 c-white"></i></a>
            </div>
        </div>
    </nav>

    <div id="bs-nav-sidebar" class="bs-nav-sidebar gradiente-linear-carbon">
        <ul>
            <li><a href="./pages/get_started.html"><i class="bs-info fz-25 c-blue-s">&nbsp;</i>Docs</a></li>
            <li><a href="https://github.com/FedeManzano/bodystyle"><i class="bs-github-2 fz-25 c-white">&nbsp;</i>Repositorio</a></li>
            <li><a href="#"><i class="bs-zip fz-25 c-yellow">&nbsp;</i>Docs v6.5.0</a></li>
        </ul>
    </div>


    <section id="main" class="alto-100 p-3 d-flex ali-center">
        <div class="row alto-100">
            <div class="cl-6 cxs-12 d-flex alto-100">
                <div class="d-flex ali-center alto-100 ancho-100 flex-column just-center">
                    <h1 class="c-white fz-110 fz-m-140 fz-s-80 fz-xs-60 ta-c">Bodystyle</h1>
                    <h2 class="c-white fz-30 fz-m-35 fz-s-25 fz-xs-20 ta-c f-w-3 mt-2">Framework para la rápida creación
                        del Frontend de sitios y aplicaciones web</h2>
                    <div class="d-flex just-center flex-wrap-s mt-8">
                        <a href="./pages/get_started.html" class="btn-cover-lg-o btn-bodyui-o bor-pill com-trigger"
                            data-info="Ingresar a la documentación" data-pos="top"><i class="bs-play fz-25">&nbsp;</i>Get Started</a>
                        <a id="descarga_docs" class="btn-cover-lg-o btn-white-o bor-pill ml-1 ml-s-0 mt-s-1 disparador"
                         data-info="" data-pos="top" data-evt="click"><i class="bs-zip fz-25">&nbsp;</i>Docs v6.5.0</a>
                    </div>
                    <div class="ta-c mt-6">
                        <a target="_blank" href="https://github.com/FedeManzano/bodystyle/releases/tag/v6.5.0" class="link tips-ele"
                        data-tips="Última versión de Bodystyle" data-pos="top">Release v6.5.0</a>
                    </div>
                </div>
            </div>

            <div class="cl-6 cxs-12 alto-100 ocultar-desde-medianos">
                <img src="./images/logo_bodystyle.svg" alt="Hero Image" class="ancho-100">
            </div>
        </div>
    </section>


    <script src="./js/docs-body.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
